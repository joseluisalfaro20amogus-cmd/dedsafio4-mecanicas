name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Compilar
        run: gradle build
      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: dedsafio4-mecanicas-jar
          path: build/libs/dedsafio4-mecanicas-1.0.0.jar
